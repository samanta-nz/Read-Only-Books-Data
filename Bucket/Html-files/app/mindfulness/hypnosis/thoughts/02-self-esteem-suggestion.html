<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><!-- key:02-self-esteem-suggestion | app id:mh-thoughts-02 | visual-only; narration belongs in MD/audio --><title>تلقین عزت‌نفس</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101522}body{min-height:100svh;overflow:hidden}.scene{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#263650,#172236 42%,#101522 78%)}.haze{position:absolute;inset:-15%;background:radial-gradient(ellipse at 28% 64%,rgba(93,151,191,.12),transparent 34%),radial-gradient(ellipse at 76% 26%,rgba(139,126,205,.13),transparent 38%);filter:blur(22px);animation:drift 18s ease-in-out infinite alternate}.orbit{position:absolute;left:50%;top:45%;width:min(72vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(188,213,246,.15);border-radius:50%;box-shadow:0 0 70px rgba(109,157,207,.07),inset 0 0 55px rgba(109,157,207,.05);animation:breathe 9s ease-in-out infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(188,213,246,.12);border-radius:50%;inset:11%}.orbit:after{inset:23%;border-color:rgba(188,213,246,.1)}.core{position:absolute;left:50%;top:45%;width:min(26vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(220,238,255,.9),rgba(145,185,232,.46) 18%,rgba(103,145,201,.13) 48%,transparent 72%);filter:drop-shadow(0 0 32px rgba(123,180,231,.24));animation:glow 8s ease-in-out infinite}.visual:before{content:"";position:absolute;left:50%;top:58%;width:min(52vw,290px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(180,211,242,.35),transparent)}.theme-bloom .core{width:min(31vw,175px);background:radial-gradient(ellipse at 50% 50%,rgba(213,239,218,.75),rgba(117,215,196,.28) 24%,rgba(145,185,232,.12) 52%,transparent 72%)}.theme-bloom .visual:before{top:45%;width:min(42vw,230px);aspect-ratio:1;height:auto;border-radius:50%;border:1px solid rgba(117,215,196,.2);box-shadow:0 0 0 18px rgba(117,215,196,.025),0 0 0 36px rgba(117,215,196,.02)}.theme-horizon .visual:before{left:-15%;right:-15%;top:61%;width:auto;height:40%;border-top:1px solid rgba(145,185,232,.3);border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(113,154,202,.07),transparent)}.theme-horizon .core{top:61%;width:min(17vw,95px)}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}@keyframes glow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.08)}}@keyframes drift{from{transform:translate3d(-2%,1%,0) scale(.96)}to{transform:translate3d(2%,-2%,0) scale(1.04)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style></head><body><main class="scene theme-bloom" aria-label="تلقین عزت‌نفس"><div class="haze" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div><div class="core" aria-hidden="true"></div><div class="visual" aria-hidden="true"></div></main></body></html>
