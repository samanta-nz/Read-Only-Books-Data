<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><!-- key:03-release-comparison | app id:mh-thoughts-03 | visual-only; narration belongs in MD/audio --><title>رهاسازی مقایسه</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101522}body{min-height:100svh;overflow:hidden}.scene{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#263650,#172236 42%,#101522 78%)}.haze{position:absolute;inset:-15%;background:radial-gradient(ellipse at 28% 64%,rgba(93,151,191,.12),transparent 34%),radial-gradient(ellipse at 76% 26%,rgba(139,126,205,.13),transparent 38%);filter:blur(22px);animation:drift 18s ease-in-out infinite alternate}.orbit{position:absolute;left:50%;top:45%;width:min(72vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(188,213,246,.15);border-radius:50%;box-shadow:0 0 70px rgba(109,157,207,.07),inset 0 0 55px rgba(109,157,207,.05);animation:breathe 9s ease-in-out infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(188,213,246,.12);border-radius:50%;inset:11%}.orbit:after{inset:23%;border-color:rgba(188,213,246,.1)}.core{position:absolute;left:50%;top:45%;width:min(26vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(220,238,255,.9),rgba(145,185,232,.46) 18%,rgba(103,145,201,.13) 48%,transparent 72%);filter:drop-shadow(0 0 32px rgba(123,180,231,.24));animation:glow 8s ease-in-out infinite}.visual:before{content:"";position:absolute;left:50%;top:58%;width:min(52vw,290px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(180,211,242,.35),transparent)}.theme-bloom .core{width:min(31vw,175px);background:radial-gradient(ellipse at 50% 50%,rgba(213,239,218,.75),rgba(117,215,196,.28) 24%,rgba(145,185,232,.12) 52%,transparent 72%)}.theme-bloom .visual:before{top:45%;width:min(42vw,230px);aspect-ratio:1;height:auto;border-radius:50%;border:1px solid rgba(117,215,196,.2);box-shadow:0 0 0 18px rgba(117,215,196,.025),0 0 0 36px rgba(117,215,196,.02)}.theme-horizon .visual:before{left:-15%;right:-15%;top:61%;width:auto;height:40%;border-top:1px solid rgba(145,185,232,.3);border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(113,154,202,.07),transparent)}.theme-horizon .core{top:61%;width:min(17vw,95px)}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}@keyframes glow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.08)}}@keyframes drift{from{transform:translate3d(-2%,1%,0) scale(.96)}to{transform:translate3d(2%,-2%,0) scale(1.04)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style><style>.voice-player{position:fixed;z-index:20;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92vw,560px);box-sizing:border-box;padding:14px 16px 12px;border:1px solid rgba(255,255,255,.24);border-radius:22px;background:rgba(13,20,31,.78);color:#fff;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 42px rgba(0,0,0,.22);font-family:inherit;direction:rtl}.voice-player *{box-sizing:border-box}.vp-status{font-size:12px;line-height:1.7;opacity:.88;text-align:center;margin:0 0 8px}.vp-progress{height:5px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;cursor:pointer}.vp-fill{height:100%;width:0;background:linear-gradient(90deg,#c7e3dc,#f1dfb8);border-radius:9px}.vp-time{display:flex;justify-content:space-between;font-size:11px;opacity:.8;margin-top:6px;direction:ltr}.vp-controls{display:flex;align-items:center;justify-content:center;gap:22px;margin:9px 0 10px}.vp-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);border-radius:50%;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;font:inherit}.vp-btn svg{width:21px;height:21px;fill:currentColor}.vp-btn.main{width:48px;height:48px;background:rgba(255,255,255,.18)}.vp-btn:focus-visible,.vp-range:focus-visible,.vp-progress:focus-visible{outline:2px solid #f1dfb8;outline-offset:3px}.vp-volume{display:flex;align-items:center;gap:10px}.vp-mute{border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer}.vp-range{width:100%;accent-color:#d9e8df;min-width:0}.vp-volume output{font-size:11px;min-width:34px;text-align:left;direction:ltr;opacity:.86}@media(max-width:420px){.voice-player{padding:11px 13px;border-radius:18px}.vp-controls{gap:18px;margin:7px 0}.vp-btn{width:36px;height:36px}.vp-btn.main{width:44px;height:44px}}</style><style>.scene-header{position:fixed;z-index:10;top:max(14px,env(safe-area-inset-top));left:0;right:0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;pointer-events:none;color:rgba(255,255,255,.94);font-family:inherit;text-shadow:0 2px 12px rgba(0,0,0,.22)}.scene-header h1{font-size:clamp(16px,3vw,22px);line-height:1.5;font-weight:600;margin:0}.scene-header .scene-kicker{font-size:10px;letter-spacing:.08em;opacity:.78;margin-top:2px}.scene-brand{font-size:12px;white-space:nowrap;opacity:.86}.scene-footer{position:fixed;z-index:9;left:0;right:0;bottom:204px;text-align:center;font-size:10px;letter-spacing:.02em;color:rgba(255,255,255,.72);text-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;font-family:inherit}@media(max-width:420px){.scene-header{padding:0 14px}.scene-brand{font-size:10px}.scene-footer{bottom:202px;font-size:9px}}</style></head><body>
<header class="scene-header"><div><h1>رهاسازی مقایسه</h1><div class="scene-kicker">تمرین ذهنی هدایت‌شده</div></div><div class="scene-brand">همیار من · HAMYAR E MAN</div></header><main class="scene theme-horizon" aria-label="رهاسازی مقایسه"><div class="haze" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div><div class="core" aria-hidden="true"></div><div class="visual" aria-hidden="true"></div></main><section class="voice-player" aria-label="کنترلر صوتی رهاسازی مقایسه">
<p class="vp-status" id="vpStatus">۶ بخش صوتی · فایل‌ها پس از بارگذاری فعال می‌شوند</p><div class="vp-progress" id="vpBar" role="progressbar" aria-label="پیشرفت صوت" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><div class="vp-fill" id="vpFill"></div></div><div class="vp-time"><span id="vpElapsed">0:00</span><span id="vpTotal">0:00</span></div>
<div class="vp-controls"><button class="vp-btn" id="vpBack" aria-label="۱۵ ثانیه عقب" title="۱۵ ثانیه عقب"><svg viewBox="0 0 24 24"><path d="M11 5v14L1 12zM23 5v14L13 12z"/></svg></button><button class="vp-btn main" id="vpPlay" aria-label="پخش / مکث" title="پخش / مکث"><svg id="vpPlayIcon" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg></button><button class="vp-btn" id="vpForward" aria-label="۱۵ ثانیه جلو" title="۱۵ ثانیه جلو"><svg viewBox="0 0 24 24"><path d="M13 5v14l10-7zM1 5v14l10-7z"/></svg></button></div>
<div class="vp-volume"><button class="vp-mute" id="vpMute" aria-label="قطع یا وصل صدا" title="قطع یا وصل صدا">🔊</button><input class="vp-range" id="vpVol" type="range" min="10" max="100" value="85" aria-label="تنظیم صدا"><output id="vpVolOut">85%</output></div></section>
<script>
(()=>{const AUDIO=["","","","","",""];const $=id=>document.getElementById(id);const aud=AUDIO.map(src=>{const a=new Audio();a.preload="metadata";if(src)a.src=src;return a});let cur=0,playing=false,muted=false,prevVol=.85;const ready=AUDIO.length===6&&AUDIO.every(Boolean);const fmt=n=>{n=Math.max(0,Math.floor(Number(n)||0));return Math.floor(n/60)+":"+String(n%60).padStart(2,"0")};const dur=i=>Number.isFinite(aud[i]?.duration)?aud[i].duration:0;const total=()=>aud.reduce((s,a)=>s+(Number.isFinite(a.duration)?a.duration:0),0);const pos=()=>aud.slice(0,cur).reduce((s,a)=>s+(Number.isFinite(a.duration)?a.duration:0),0)+(aud[cur]?.currentTime||0);
function render(){const t=total(),p=pos();$("vpElapsed").textContent=fmt(p);$("vpTotal").textContent=fmt(t);$("vpFill").style.width=(t?Math.min(100,p/t*100):0)+"%";$("vpBar").setAttribute("aria-valuenow",String(t?Math.round(p/t*100):0));$("vpPlayIcon").innerHTML=playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';$("vpStatus").textContent=ready?("بخش "+(cur+1)+" از ۶ · "+(playing?"در حال پخش":"آماده‌ی پخش")):"۶ بخش صوتی · فایل‌ها پس از تولید و بارگذاری فعال می‌شوند"}
function go(i,autoplay){if(!ready){$("vpStatus").textContent="فایل‌های MP3 هنوز به این قالب متصل نشده‌اند.";return}aud[cur].pause();cur=Math.max(0,Math.min(5,i));aud[cur].currentTime=0;if(autoplay)play();else{playing=false;render()}}
async function play(){if(!ready){$("vpStatus").textContent="فایل‌های MP3 هنوز به این قالب متصل نشده‌اند.";return}try{await aud[cur].play();playing=true;render()}catch(e){$("vpStatus").textContent="پخش صوت در دسترس نیست؛ فایل‌های MP3 را بررسی کن."}}
function pause(){aud[cur]?.pause();playing=false;render()}
$("vpPlay").addEventListener("click",()=>playing?pause():play());$("vpBack").addEventListener("click",()=>{if(!ready){render();$("vpStatus").textContent="فایل‌های MP3 هنوز به این قالب متصل نشده‌اند.";return}if(aud[cur].currentTime>15)aud[cur].currentTime-=15;else if(cur>0)go(cur-1,true);else aud[cur].currentTime=0;render()});$("vpForward").addEventListener("click",()=>{if(!ready){$("vpStatus").textContent="فایل‌های MP3 هنوز به این قالب متصل نشده‌اند.";return}if(aud[cur].currentTime+15<dur(cur))aud[cur].currentTime+=15;else if(cur<5)go(cur+1,true);else aud[cur].currentTime=dur(cur);render()});
$("vpVol").addEventListener("input",e=>{prevVol=Number(e.target.value)/100;aud.forEach(a=>a.volume=prevVol);if(!muted)aud.forEach(a=>a.muted=false);$("vpVolOut").textContent=e.target.value+"%";$("vpMute").textContent="🔊"});$("vpMute").addEventListener("click",()=>{muted=!muted;aud.forEach(a=>a.muted=muted);$("vpMute").textContent=muted?"🔇":"🔊";if(!muted)aud.forEach(a=>a.volume=prevVol)});
$("vpBar").addEventListener("click",e=>{if(!ready||!total())return;const r=e.currentTarget.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),target=pct*total();let sum=0;for(let i=0;i<6;i++){if(target<=sum+dur(i)||i===5){if(i!==cur){aud[cur].pause();cur=i}aud[cur].currentTime=Math.max(0,target-sum);render();return}sum+=dur(i)}});aud.forEach((a,i)=>{a.addEventListener("loadedmetadata",render);a.addEventListener("timeupdate",render);a.addEventListener("ended",()=>{if(i<5)go(i+1,true);else{playing=false;cur=5;render()}})});render();})();
</script>
<footer class="scene-footer">در جای امن استفاده کن؛ هر زمان خواستی می‌تونی تمرین رو متوقف کنی.</footer>
</body></html>
