<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><!-- key:02-visualize-finishing-chapter | app id:mh-study-02 | visual-only; narration belongs in MD/audio --><title>تجسم کامل‌کردن فصل</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101522}body{min-height:100svh;overflow:hidden}.scene{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#263650,#172236 42%,#101522 78%)}.haze{position:absolute;inset:-15%;background:radial-gradient(ellipse at 28% 64%,rgba(93,151,191,.12),transparent 34%),radial-gradient(ellipse at 76% 26%,rgba(139,126,205,.13),transparent 38%);filter:blur(22px);animation:drift 18s ease-in-out infinite alternate}.orbit{position:absolute;left:50%;top:45%;width:min(72vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(188,213,246,.15);border-radius:50%;box-shadow:0 0 70px rgba(109,157,207,.07),inset 0 0 55px rgba(109,157,207,.05);animation:breathe 9s ease-in-out infinite}.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(188,213,246,.12);border-radius:50%;inset:11%}.orbit:after{inset:23%;border-color:rgba(188,213,246,.1)}.core{position:absolute;left:50%;top:45%;width:min(26vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(220,238,255,.9),rgba(145,185,232,.46) 18%,rgba(103,145,201,.13) 48%,transparent 72%);filter:drop-shadow(0 0 32px rgba(123,180,231,.24));animation:glow 8s ease-in-out infinite}.visual:before{content:"";position:absolute;left:50%;top:58%;width:min(52vw,290px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(180,211,242,.35),transparent)}.theme-pages .visual:before{top:48%;width:min(38vw,210px);height:min(48vw,265px);border:1px solid rgba(183,211,243,.28);border-radius:4px;transform:translate(-50%,-50%) rotate(-5deg);box-shadow:10px 7px 0 -1px #1b2b40,10px 7px 0 0 rgba(183,211,243,.17),-12px 11px 0 -1px #1b2b40,-12px 11px 0 0 rgba(183,211,243,.13)}.theme-path .visual:before{left:50%;top:48%;width:1px;height:45%;background:linear-gradient(transparent,rgba(145,185,232,.5),transparent);transform:rotate(18deg)}.theme-path .visual:after{content:"";position:absolute;left:calc(50% - 5px);top:30%;width:10px;aspect-ratio:1;border-radius:50%;background:rgba(204,227,250,.75);box-shadow:0 0 22px rgba(145,185,232,.7)}.theme-cloud .visual:before{top:42%;width:min(55vw,310px);height:min(25vw,130px);border-radius:50%;background:radial-gradient(ellipse,rgba(140,159,210,.12),transparent 70%);filter:blur(8px)}@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}@keyframes glow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.08)}}@keyframes drift{from{transform:translate3d(-2%,1%,0) scale(.96)}to{transform:translate3d(2%,-2%,0) scale(1.04)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}</style></head><body><main class="scene theme-pages" aria-label="تجسم کامل‌کردن فصل"><div class="haze" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div><div class="core" aria-hidden="true"></div><div class="visual" aria-hidden="true"></div></main></body></html>
