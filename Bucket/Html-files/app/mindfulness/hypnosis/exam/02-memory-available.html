<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101522"><!-- key:02-memory-available | app id:mh-exam-02 | visual-only; narration belongs in MD/audio --><title>حافظه‌ام در دسترسمه</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101522}body{min-height:100svh;overflow:hidden}
.scene{position:relative;isolation:isolate;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#263650,#172236 42%,#101522 78%)}
.haze{position:absolute;inset:-15%;background:radial-gradient(ellipse at 28% 64%,rgba(93,151,191,.12),transparent 34%),radial-gradient(ellipse at 76% 26%,rgba(139,126,205,.13),transparent 38%);filter:blur(22px);animation:drift 18s ease-in-out infinite alternate}
.orbit{position:absolute;left:50%;top:45%;width:min(72vw,440px);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(188,213,246,.15);border-radius:50%;box-shadow:0 0 70px rgba(109,157,207,.07),inset 0 0 55px rgba(109,157,207,.05);animation:breathe 9s ease-in-out infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid rgba(188,213,246,.12);border-radius:50%;inset:11%}.orbit:after{inset:23%;border-color:rgba(188,213,246,.1)}
.core{position:absolute;left:50%;top:45%;width:min(26vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,rgba(220,238,255,.9),rgba(145,185,232,.46) 18%,rgba(103,145,201,.13) 48%,transparent 72%);filter:drop-shadow(0 0 32px rgba(123,180,231,.24));animation:glow 8s ease-in-out infinite}
.visual:before{content:"";position:absolute;left:50%;top:58%;width:min(52vw,290px);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(180,211,242,.35),transparent)}
.theme-memory .orbit{width:min(62vw,360px)}.theme-memory .core{background:radial-gradient(circle,rgba(213,234,255,.7),rgba(120,173,220,.23) 32%,transparent 70%)}
.theme-waves .visual:before{left:-20%;right:-20%;top:56%;width:auto;height:35%;border-top:1px solid rgba(145,185,232,.28);border-radius:50%;box-shadow:0 -18px 0 rgba(145,185,232,.09),0 -38px 0 rgba(145,185,232,.06),0 -60px 0 rgba(145,185,232,.04)}
.theme-two .core{width:min(19vw,108px);left:42%;background:radial-gradient(circle,rgba(212,236,255,.7),rgba(117,215,196,.2) 50%,transparent 75%)}
.theme-two .visual:after{content:"";position:absolute;left:58%;top:45%;width:min(24vw,135px);aspect-ratio:1;border:1px solid rgba(145,185,232,.28);border-radius:50%;transform:translate(-50%,-50%)}
@keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(.96);opacity:.65}50%{transform:translate(-50%,-50%) scale(1.04);opacity:1}}@keyframes glow{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.95;transform:translate(-50%,-50%) scale(1.08)}}@keyframes drift{from{transform:translate3d(-2%,1%,0) scale(.96)}to{transform:translate3d(2%,-2%,0) scale(1.04)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style></head><body><main class="scene theme-memory" aria-label="حافظه‌ام در دسترسمه"><div class="haze" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div><div class="core" aria-hidden="true"></div><div class="visual" aria-hidden="true"></div></main></body></html>
